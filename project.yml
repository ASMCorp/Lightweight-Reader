name: LightweightReader
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  LightweightReader:
    type: application
    platform: macOS
    sources:
      - Sources/LightweightReader
    info:
      path: Support/LightweightReader-Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: Lightweight Reader
        CFBundleIconFile: AppIcon.icns
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF document
            LSItemContentTypes: [com.adobe.pdf]
            CFBundleTypeRole: Viewer
          - CFBundleTypeName: Markdown document
            LSItemContentTypes: [net.daringfireball.markdown]
            CFBundleTypeRole: Editor
          - CFBundleTypeName: JSON document
            LSItemContentTypes: [public.json]
            CFBundleTypeRole: Viewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.LightweightReader
        GENERATE_INFOPLIST_FILE: NO
  reader-agent:
    type: tool
    platform: macOS
    sources:
      - Sources/ReaderAgent
      - Sources/LightweightReader/DocumentCore.swift
      - Sources/LightweightReader/AgentDocumentService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.LightweightReader.agent
